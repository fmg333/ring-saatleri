name: APK üret

on:
  push:
    branches: [main]
    paths: ["index.html", "ring-data.json", "android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Web dosyalarını APK içine kopyala
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html ring-data.json android/app/src/main/assets/www/

      - name: APK derle
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: APK'yı yeniden adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk ring-saatleri.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ring-saatleri-apk
          path: ring-saatleri.apk

      - name: Releases sayfasına ekle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Ring saatleri APK ${{ github.run_number }}
          files: ring-saatleri.apk
