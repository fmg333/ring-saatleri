<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#0E1216" media="(prefers-color-scheme: dark)">

<title>Ring saatleri</title>
<style>
  :root{
    color-scheme:light dark;
    --bg:#F2F4F6; --panel:#FFFFFF; --ink:#151A21; --muted:#66707C; --line:#DFE4EA;
    --field:#F6F8FA; --focus:#151A21;
    --r1:#1D5FD1; --r2:#178F52; --r3:#E0611F;
    --r1-soft:#E4EDFC; --r2-soft:#E1F3E9; --r3-soft:#FCE9DE;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0E1216; --panel:#171C22; --ink:#EDF0F3; --muted:#8B95A1; --line:#2A313A;
      --field:#1F252D; --focus:#EDF0F3;
      --r1:#5B8DEB; --r2:#3FBF7A; --r3:#F28A4E;
      --r1-soft:#1B2A45; --r2-soft:#163527; --r3-soft:#3D2416;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
    font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .app{max-width:520px;margin:0 auto;padding:16px 16px 40px}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  h1{font-size:21px;font-weight:700;letter-spacing:-.01em;margin:0;white-space:nowrap}

  .seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:2px}
  .seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;
    font-weight:600;padding:7px 11px;border-radius:8px;cursor:pointer;min-height:36px;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:13px;color:var(--muted);font-weight:500}
  .stops{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;gap:10px 8px;align-items:end}
  .stops .field:nth-child(1){grid-column:1;grid-row:1}
  .stops .field:nth-child(2){grid-column:1;grid-row:2}
  .stops .swap{grid-column:2;grid-row:1 / span 2;align-self:center}
  select,input[type=time]{appearance:none;-webkit-appearance:none;width:100%;font:inherit;font-size:18px;font-weight:600;
    color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:48px}
  select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 14 14'><path d='M3 5l4 4 4-4' fill='none' stroke='%2366707C' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;padding-right:36px}
  select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .swap{appearance:none;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:10px;
    width:48px;height:48px;font-size:20px;cursor:pointer;display:grid;place-items:center}
  .timebar{display:flex;align-items:center;gap:10px;margin-top:12px}
  .timebar input[type=time]{width:auto;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .timebar .live{font-size:13px;color:var(--muted);flex:1}
  .timebar .live b{color:var(--ink);font-weight:600}
  .now{appearance:none;border:0;background:var(--ink);color:var(--bg);font:inherit;font-size:14px;font-weight:600;
    padding:10px 14px;border-radius:10px;cursor:pointer;min-height:40px}
  .now[disabled]{opacity:.35;cursor:default}

  section{margin-top:22px}
  section h2{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  section h2 strong{color:var(--ink);font-weight:700;font-size:17px}
  .list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:11px 14px 11px 12px;
    border-top:1px solid var(--line);border-left:5px solid transparent}
  .row:first-child{border-top:0}
  .row.r1{border-left-color:var(--r1)} .row.r2{border-left-color:var(--r2)} .row.r3{border-left-color:var(--r3)}
  .pill{display:inline-grid;place-items:center;min-width:38px;height:28px;padding:0 8px;border-radius:8px;
    font-weight:800;font-size:14px;letter-spacing:.01em}
  .pill.r1{background:var(--r1-soft);color:var(--r1)} .pill.r2{background:var(--r2-soft);color:var(--r2)} .pill.r3{background:var(--r3-soft);color:var(--r3)}
  .mid{min-width:0}
  .mid .l1{font-weight:600;font-variant-numeric:tabular-nums}
  .mid .l2{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .eta{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .eta b{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .eta small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .eta.zero b,.eta.long b{font-size:17px}
  .empty{padding:16px 14px;color:var(--muted);font-size:15px}
  .empty b{color:var(--ink);font-weight:600}
  .mini{display:inline-block;font-size:12px;font-weight:800;padding:1px 6px;border-radius:6px;vertical-align:1px}
  .mini.r1{background:var(--r1-soft);color:var(--r1)} .mini.r2{background:var(--r2-soft);color:var(--r2)} .mini.r3{background:var(--r3-soft);color:var(--r3)}

  details{margin-top:26px;color:var(--muted);font-size:14px}
  summary{cursor:pointer;font-weight:600;color:var(--ink)}
  .route{display:flex;gap:10px;align-items:flex-start;margin-top:10px;line-height:1.5}
  .route .pill{flex:0 0 auto;margin-top:1px}
  .route .path{display:block;overflow-wrap:anywhere}
  @media (prefers-reduced-motion:no-preference){
    .row{transition:background-color .15s}
  }
</style>
</head>

<div class="app">
  <header>
    <h1>Ring saatleri</h1>
    <div class="seg" role="group" aria-label="Gün tipi">
      <button type="button" data-day="weekday" aria-pressed="true">Hafta içi</button>
      <button type="button" data-day="weekend" aria-pressed="false">Hafta sonu</button>
    </div>
  </header>

  <div class="panel">
    <div class="stops">
      <div class="field">
        <label for="from">Bulunduğum durak</label>
        <select id="from"><option value="">Durak seç</option></select>
      </div>
      <div class="field">
        <label for="to">Gideceğim durak</label>
        <select id="to"><option value="">İsteğe bağlı</option></select>
      </div>
      <button type="button" class="swap" id="swap" title="Durakları değiştir" aria-label="Durakları değiştir">⇅</button>
    </div>
    <div class="timebar">
      <input type="time" id="time" aria-label="Saat">
      <div class="live" id="livelabel"></div>
      <button type="button" class="now" id="now" disabled>Şimdi</button>
    </div>
  </div>

  <section id="trip-section" hidden>
    <h2 id="trip-title"></h2>
    <div class="list" id="trip-list"></div>
  </section>

  <section id="dep-section">
    <h2 id="dep-title">Yaklaşan ringler</h2>
    <div class="list" id="dep-list"></div>
  </section>

  <details>
    <summary>Güzergâhlar</summary>
    <div id="routes"></div>
  </details>
</div>

const ENDS = DATA.ends;
const DAY_NAMES = {weekday:'hafta içi', weekend:'hafta sonu'};
const LOOKAHEAD_MIN = 180;     // aktarmalı aramada ilk binişi bu kadar ileriye bak
const MAX_XFER_WAIT = 60;      // aktarma noktasında en fazla bekleme
const MIN_XFER_GAP = 1;        // aktarma için en az geçiş süresi (dk)

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

const $ = s => document.querySelector(s);
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const autoDay = () => { const w = new Date().getDay(); return (w===0 || w===6) ? 'weekend' : 'weekday'; };
const hhmm = m => String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
function dur(m){
  if (m <= 0) return 'şimdi';
  if (m < 60) return m + ' dk';
  const h = Math.floor(m/60), r = m % 60;
  return r ? h + ' sa ' + r + ' dk' : h + ' sa';
}

const state = {
  dayType: autoDay(),
  live: true,
  time: nowMin(),
  from: store.get('ring.from') || '',
  to: store.get('ring.to') || ''
};

/* ---------- sefer verisi ---------- */
const tripCache = {};
function tripsFor(dayType){
  if (tripCache[dayType]) return tripCache[dayType];
  const out = [];
  for (const ring of Object.keys(DATA.rings)) {
    const d = DATA.rings[ring][dayType];
    if (!d) continue;
    for (const times of d.trips) out.push({ring, stops: d.stops, times});
  }
  // durak -> [{tr, i}] biniş indeksi (son durakta biniş olmaz)
  const board = new Map();
  for (const tr of out) {
    for (let i = 0; i < tr.stops.length - 1; i++) {
      const s = tr.stops[i];
      if (!board.has(s)) board.set(s, []);
      board.get(s).push({tr, i});
    }
  }
  for (const arr of board.values()) arr.sort((a,b) => a.tr.times[a.i] - b.tr.times[b.i]);
  return (tripCache[dayType] = {trips: out, board});
}

// i. duraktan sonra gelen ilk uç durak = gidiş yönü
function dirAt(stops, i){
  for (let j = i + 1; j < stops.length; j++) if (ENDS.includes(stops[j])) return stops[j];
  return null;
}

function departures(stop, dayType, t){
  const {board} = tripsFor(dayType);
  const out = [];
  for (const {tr, i} of (board.get(stop) || [])) {
    if (tr.times[i] < t) continue;
    out.push({ring: tr.ring, time: tr.times[i], dir: dirAt(tr.stops, i)});
  }
  out.sort((a,b) => a.time - b.time || a.ring.localeCompare(b.ring));
  return out;
}

function firstDeparture(stop, dayType){
  const list = departures(stop, dayType, 0);
  return list.length ? list[0] : null;
}

// Geç kalkıp erken/aynı anda varan seçenek varsa diğerini ele
function pareto(list){
  const keep = list.filter(x => !list.some(y =>
    y !== x && y.dep >= x.dep && y.arr <= x.arr && (y.dep > x.dep || y.arr < x.arr)));
  keep.sort((a,b) => a.arr - b.arr || b.dep - a.dep || a.ring.localeCompare(b.ring));
  return keep;
}

function directTrips(from, to, dayType, t){
  const {board} = tripsFor(dayType);
  const out = [];
  for (const {tr, i} of (board.get(from) || [])) {
    if (tr.times[i] < t) continue;
    for (let j = i + 1; j < tr.stops.length; j++) {
      if (tr.stops[j] === to) {
        out.push({ring: tr.ring, dep: tr.times[i], arr: tr.times[j], dir: dirAt(tr.stops, i)});
        break;
      }
    }
  }
  return pareto(out);
}

function transferTrips(from, to, dayType, t){
  const {board} = tripsFor(dayType);
  const out = [];
  for (const {tr, i} of (board.get(from) || [])) {
    const dep = tr.times[i];
    if (dep < t || dep > t + LOOKAHEAD_MIN) continue;
    const seen = new Set();
    for (let k = i + 1; k < tr.stops.length; k++) {
      const mid = tr.stops[k];
      if (mid === from || mid === to || seen.has(mid)) continue;
      seen.add(mid);
      const tMid = tr.times[k];
      for (const b of (board.get(mid) || [])) {
        const dep2 = b.tr.times[b.i];
        if (dep2 < tMid + MIN_XFER_GAP) continue;
        if (dep2 > tMid + MAX_XFER_WAIT) break;   // biniş listesi saate göre sıralı
        if (b.tr === tr) continue;
        const s2 = b.tr.stops, t2 = b.tr.times;
        for (let j = b.i + 1; j < s2.length; j++) {
          if (s2[j] === to) {
            out.push({ring: tr.ring, dep, dir: dirAt(tr.stops, i), mid, midArr: tMid,
                      ring2: b.tr.ring, dep2, dir2: dirAt(s2, b.i), arr: t2[j]});
            break;
          }
        }
      }
    }
  }
  // aynı iki otobüs, farklı aktarma durakları -> ilk (en erken) aktarma noktasını tut
  const seenKey = new Set();
  const uniq = out.filter(x => {
    const k = x.ring + ':' + x.dep + ':' + x.ring2 + ':' + x.arr;
    if (seenKey.has(k)) return false;
    seenKey.add(k); return true;
  });
  return pareto(uniq);
}

function eta(min, label){
  if (min <= 0) return '<div class="eta zero"><b>şimdi</b></div>';
  if (min < 120) return '<div class="eta"><b>' + min + '</b><small>' + (label || 'dk') + '</small></div>';
  return '<div class="eta long"><b>' + dur(min) + '</b><small>' + (label ? label.replace(/^dk ?/, '') : '') + '</small></div>';
}

function renderDepartures(){
  const list = $('#dep-list'), title = $('#dep-title');
  if (!state.from) {
    title.innerHTML = 'Yaklaşan ringler';
    list.innerHTML = '<div class="empty">Bulunduğun durağı seç; hangi ringin kaç dakika sonra geleceği burada listelenir.</div>';
    return;
  }
  title.innerHTML = 'Yaklaşan ringler <strong>' + state.from + '</strong>';
  const deps = departures(state.from, state.dayType, state.time).slice(0, 8);
  if (!deps.length) {
    const first = firstDeparture(state.from, state.dayType);
    list.innerHTML = '<div class="empty">' + hhmm(state.time) + ' sonrası için bu duraktan sefer yok.' +
      (first ? ' Günün ilk seferi <b>' + hhmm(first.time) + '</b> (R' + first.ring + ', ' + first.dir + ' yönü).' : '') + '</div>';
    return;
  }
  list.innerHTML = deps.map(d =>
    '<div class="row r' + d.ring + '">' + pill(d.ring) +
    '<div class="mid"><div class="l1">' + d.dir + ' yönü</div><div class="l2">' + hhmm(d.time) + '</div></div>' +
    eta(d.time - state.time) + '</div>').join('');
}

function renderTrips(){
  const sec = $('#trip-section'), list = $('#trip-list'), title = $('#trip-title');
  if (!state.from || !state.to || state.from === state.to) { sec.hidden = true; return; }
  sec.hidden = false;
  title.innerHTML = '<strong>' + state.from + ' → ' + state.to + '</strong><span>' + DAY_NAMES[state.dayType] + '</span>';

  const direct = directTrips(state.from, state.to, state.dayType, state.time).slice(0, 6);
  if (direct.length) {
    list.innerHTML = direct.map(x =>
      '<div class="row r' + x.ring + '">' + pill(x.ring) +
      '<div class="mid"><div class="l1">' + hhmm(x.dep) + ' → ' + hhmm(x.arr) + '</div>' +
      '<div class="l2">' + (x.arr - x.dep) + ' dk yolda, ' + x.dir + ' yönü</div></div>' +
      eta(x.dep - state.time, 'dk sonra') + '</div>').join('');
    return;
  }

  const xfers = transferTrips(state.from, state.to, state.dayType, state.time).slice(0, 4);
  if (!xfers.length) {
    list.innerHTML = '<div class="empty">' + hhmm(state.time) + ' sonrası için bu iki durak arasında sefer bulunamadı.</div>';
    return;
  }
  list.innerHTML = '<div class="empty">Doğrudan ring yok, aktarmalı seçenekler:</div>' + xfers.map(x =>
    '<div class="row xfer r' + x.ring + '">' + pill(x.ring) +
    '<div class="mid"><div class="l1">' + hhmm(x.dep) + ' → ' + x.mid + ' ' + hhmm(x.midArr) + '</div>' +
    '<div class="l1"><span class="mini r' + x.ring2 + '">R' + x.ring2 + '</span> ' + hhmm(x.dep2) + ' → ' + state.to + ' ' + hhmm(x.arr) + '</div>' +
    '<div class="l2">toplam ' + (x.arr - x.dep) + ' dk, ' + x.mid + ' durağında ' + (x.dep2 - x.midArr) + ' dk aktarma</div></div>' +
    eta(x.dep - state.time, 'dk sonra') + '</div>').join('');
}

function renderControls(){
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.day === state.dayType)));
  $('#time').value = hhmm(state.time);
  $('#now').disabled = state.live;
  $('#livelabel').innerHTML = state.live ? '<b>Canlı</b>' : 'Seçilen saat';
  $('#from').value = state.from;
  $('#to').value = state.to;
}

function render(){ renderControls(); renderDepartures(); renderTrips(); }

function renderRoutes(){
  const box = $('#routes');
  box.innerHTML = Object.keys(DATA.rings).map(r => {
    const d = DATA.rings[r].weekday || DATA.rings[r].weekend;
    return '<div class="route">' + pill(r) + '<span class="path">' + d.stops.join(' → ') + '</span></div>';
  }).join('');
}

/* ---------- olaylar ---------- */
function fillSelects(){
  const opts = DATA.stops.map(s => '<option value="' + s + '">' + s + '</option>').join('');
  $('#from').insertAdjacentHTML('beforeend', opts);
  $('#to').insertAdjacentHTML('beforeend', opts);
  if (!DATA.stops.includes(state.from)) state.from = '';
  if (!DATA.stops.includes(state.to)) state.to = '';
}

$('#from').addEventListener('change', e => { state.from = e.target.value; store.set('ring.from', state.from); render(); });
$('#to').addEventListener('change', e => { state.to = e.target.value; store.set('ring.to', state.to); render(); });
$('#swap').addEventListener('click', () => {
  [state.from, state.to] = [state.to, state.from];
  store.set('ring.from', state.from); store.set('ring.to', state.to); render();
});
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  state.dayType = b.dataset.day; render();
}));
$('#time').addEventListener('change', e => {
  const m = /^(\d{1,2}):(\d{2})/.exec(e.target.value || '');
  if (!m) return;
  state.live = false; state.time = (+m[1]) * 60 + (+m[2]); render();
});
$('#now').addEventListener('click', () => { state.live = true; state.time = nowMin(); state.dayType = autoDay(); render(); });

setInterval(() => {
  if (!state.live) return;
  const t = nowMin(), d = autoDay();
  if (t !== state.time || d !== state.dayType) { state.time = t; state.dayType = d; render(); }
}, 10000);
function refreshLive(){ if (state.live) { state.time = nowMin(); state.dayType = autoDay(); render(); } }
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshLive(); });
window.addEventListener('focus', refreshLive);

fillSelects();
renderRoutes();
render();

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
